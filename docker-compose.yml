services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rootme
      POSTGRES_USER: rootme
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rootme-local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres16_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rootme", "-d", "rootme"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres16_data:
