server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful

rootme:
  frontend-port: ${ROOTME_FRONTEND_PORT:5173}
  storage:
    photos-directory: ${ROOTME_STORAGE_PHOTOS_DIRECTORY:data/photos}
    backups-directory: ${ROOTME_STORAGE_BACKUPS_DIRECTORY:backups}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: rootme
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/rootme}
    username: rootme
    password: ${DB_PASSWORD:rootme-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
